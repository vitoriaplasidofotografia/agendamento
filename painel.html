<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel de agendamentos · Vitória</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#070b14; --bg2:#0b1222; --panel:#0e1526; --line:#1d2a44;
  --cyan:#36f1e0; --cyan-soft:#1a6e6c; --violet:#7c5cff; --magenta:#ff4fd8;
  --ink:#e8f1ff; --soft:#8ea2c6; --danger:#ff4d6a;
  --ok:#36f1a0; --warn:#ffcc4d;
  --disp:"Poppins","Roboto",sans-serif;
  --sans:"Roboto","Helvetica Neue",Arial,sans-serif;
  --mono:"Roboto Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.45;
  background-image:radial-gradient(circle at 15% 0%,rgba(124,92,255,.18),transparent 45%),radial-gradient(circle at 85% 20%,rgba(54,241,224,.12),transparent 40%);
  background-attachment:fixed}
button,input,select{font:inherit}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-family:var(--disp);font-weight:700;font-size:24px;margin:0;letter-spacing:.04em;color:var(--cyan);text-shadow:0 0 18px rgba(54,241,224,.35)}
.sair{appearance:none;border:0;background:none;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:14px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 0 0 1px rgba(124,92,255,.06),0 20px 40px -24px rgba(0,0,0,.6)}
label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);display:block;margin-bottom:6px}
input,select{width:100%;border:1px solid var(--line);background:#0a1120;border-radius:10px;padding:11px 12px;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--cyan);outline-offset:1px}
.btn{appearance:none;border:0;background:linear-gradient(90deg,var(--violet),var(--cyan));color:#061018;border-radius:999px;padding:12px 18px;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan-soft)}
.btn.perigo{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;align-items:end}
.faixa{display:none;grid-column:1/-1;grid-template-columns:1fr 1fr;gap:12px}
.faixa.on{display:grid}
@media (max-width:560px){.filtros{grid-template-columns:1fr}}
.resumo{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.pill{font-family:var(--mono);border-radius:999px;padding:6px 12px;font-size:13px;background:#0a1120;border:1px solid var(--line);color:var(--soft)}
.pill b{font-weight:500;color:var(--ink)}
.pill.novo{border-color:var(--magenta);color:var(--magenta);background:rgba(255,79,216,.08)}
.dia{font-family:var(--disp);font-size:16px;font-weight:600;margin:22px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);border-bottom:1px solid var(--line);padding-bottom:6px}
.item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.item.novo{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(255,79,216,.14)}
.hora{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--cyan)}
.nome{font-weight:500;font-size:16px;color:var(--ink)}
.meta{font-size:13px;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.tag.aguard{color:var(--warn);border-color:var(--warn);background:rgba(255,204,77,.08)}
.tag.ok{color:var(--ok);border-color:var(--ok);background:rgba(54,241,160,.08)}
.tag.canc{color:#6b7996;border-color:#2a3a5c;text-decoration:line-through}
.tag.novo{color:#061018;background:var(--magenta);border-color:var(--magenta)}
.tag.resta{color:var(--violet);border-color:var(--violet);background:rgba(124,92,255,.1)}
.acoes{display:flex;flex-direction:column;gap:6px}
.acoes .btn{padding:9px 12px;font-size:11px;white-space:nowrap}
a.zap{color:var(--cyan);text-decoration:none;font-size:13px}
a.zap:hover{text-decoration:underline}
.vazio{text-align:center;color:var(--soft);padding:30px 0;font-family:var(--mono);font-style:italic;font-size:16px}
.financas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.fin{background:#0a1120;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fin .rotulo{font-family:var(--mono);font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.fin .numero{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.fin.pago .numero{color:var(--ok);text-shadow:0 0 14px rgba(54,241,160,.3)}
.fin.pendente .numero{color:var(--warn);text-shadow:0 0 14px rgba(255,204,77,.25)}
.fin.saldo .numero{color:var(--violet);text-shadow:0 0 14px rgba(124,92,255,.3)}
@media (max-width:560px){.financas{grid-template-columns:1fr}}
.erro{color:var(--danger);font-size:14px;margin-top:8px;min-height:1em}
.login{max-width:360px;margin:60px auto 0}
.login h1{text-align:center;margin-bottom:12px;font-size:26px}
.login .btn{width:100%;margin-top:12px}
.atualiza{font-family:var(--mono);font-size:11px;color:var(--soft);text-align:right;margin-top:6px}
[hidden]{display:none!important}
@media (max-width:480px){.item{grid-template-columns:58px 1fr}.acoes{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">

  <!-- login -->
  <section class="login card" id="tela-login">
    <h1>Painel da Vitória</h1>
    <label for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password">
    <button class="btn" id="entrar" type="button">Entrar</button>
    <p class="erro" id="erro-login"></p>
  </section>

  <!-- painel -->
  <section id="tela-painel" hidden>
    <header>
      <h1>Agendamentos</h1>
      <button class="sair" id="sair" type="button">Sair</button>
    </header>

    <div class="card">
      <div class="filtros">
        <div>
          <label for="periodo">Período</label>
          <select id="periodo">
            <option value="hoje">Hoje</option>
            <option value="semana">Esta semana</option>
            <option value="mes">Este mês</option>
            <option value="30dias">Próximos 30 dias</option>
            <option value="todos" selected>Todos os agendamentos</option>
            <option value="custom">Escolher datas</option>
          </select>
        </div>
        <div>
          <button class="btn ghost" id="atualizar" type="button" style="width:100%">Atualizar</button>
        </div>
        <div></div>
        <div class="faixa" id="faixa-custom">
          <div><label for="de">De</label><input type="date" id="de"></div>
          <div><label for="ate">Até</label><input type="date" id="ate"></div>
        </div>
      </div>
      <div class="financas" id="financas">
        <div class="fin pago"><div class="rotulo">Recebido (sinal confirmado)</div><div class="numero" id="fin-pago">R$ 0,00</div></div>
        <div class="fin pendente"><div class="rotulo">Sinal aguardando confirmação</div><div class="numero" id="fin-pendente">R$ 0,00</div></div>
        <div class="fin saldo"><div class="rotulo">Resta receber (no dia da sessão)</div><div class="numero" id="fin-saldo">R$ 0,00</div></div>
      </div>
      <div class="resumo" id="resumo"></div>
      <p class="erro" id="erro-painel"></p>
      <p class="atualiza" id="atualizado"></p>
    </div>

    <div id="lista"></div>
  </section>
</div>

<script>
/* mesma URL do app da web usada no agendamento */
const API_URL = 'https://script.google.com/macros/s/AKfycbwyPsHThAdTGlgQibJ7ZD1woOcF_W6LcFe-4L0pd5DFfmHUqrS4XFiZm8Oqcaq9YB7n/exec';
const CHAVE_SESSAO = 'painel-agenda-senha';
const STATUS_AGUARDA = 'aguardando sinal';
const STATUS_OK = 'sinal confirmado';
const STATUS_CANC = 'cancelado';

function lerReais(txt) {
  if (!txt) return 0;
  const n = String(txt).replace(/[^0-9,.-]/g, '').replace(/\./g, '').replace(',', '.');
  const v = parseFloat(n);
  return isNaN(v) ? 0 : v;
}
function formatarReais(v) {
  return 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const NOVO_HORAS = 24;

const $ = (id) => document.getElementById(id);
const pad = (n) => (n < 10 ? '0' : '') + n;
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
let senha = '';
let dados = [];
let timer = null;

function guardarSenha(s) { try { sessionStorage.setItem(CHAVE_SESSAO, s); } catch (e) {} }
function lerSenha() { try { return sessionStorage.getItem(CHAVE_SESSAO) || ''; } catch (e) { return ''; } }

function intervalo() {
  const hoje = new Date();
  const v = $('periodo').value;
  if (v === 'hoje') return [iso(hoje), iso(hoje)];
  if (v === 'semana') {
    const ini = new Date(hoje); ini.setDate(hoje.getDate() - hoje.getDay());
    const fim = new Date(ini); fim.setDate(ini.getDate() + 6);
    return [iso(ini), iso(fim)];
  }
  if (v === 'mes') {
    return [iso(new Date(hoje.getFullYear(), hoje.getMonth(), 1)), iso(new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0))];
  }
  if (v === 'todos') return ['2000-01-01', '2999-12-31'];
  if (v === '30dias') {
    const fim = new Date(hoje); fim.setDate(hoje.getDate() + 30);
    return [iso(hoje), iso(fim)];
  }
  return [$('de').value || iso(hoje), $('ate').value || iso(hoje)];
}

async function chamar(corpo) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) });
  return r.json();
}

async function carregar() {
  const [de, ate] = intervalo();
  $('erro-painel').textContent = '';
  try {
    const r = await chamar({ acao: 'listar', senha: senha, de: de, ate: ate });
    if (!r.ok) {
      if (/Senha/.test(r.erro)) { sair(); $('erro-login').textContent = 'Senha incorreta.'; return; }
      $('erro-painel').textContent = r.erro; return;
    }
    dados = r.agendamentos;
    desenhar();
    $('atualizado').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    $('erro-painel').textContent = 'Sem conexão. Tentando de novo em 1 minuto.';
  }
}

function ehNovo(a) {
  if (a.status !== STATUS_AGUARDA) return false;
  const criado = new Date(a.criado_em.replace(' ', 'T') + ':00');
  return (Date.now() - criado.getTime()) < NOVO_HORAS * 3600 * 1000;
}

function desenhar() {
  const ativos = dados.filter((a) => a.status !== STATUS_CANC);
  const pago = ativos.filter((a) => a.status === STATUS_OK).reduce((s, a) => s + lerReais(a.sinal_txt), 0);
  const pendente = ativos.filter((a) => a.status === STATUS_AGUARDA).reduce((s, a) => s + lerReais(a.sinal_txt), 0);
  const saldo = ativos.reduce((s, a) => s + (lerReais(a.valor_txt) - lerReais(a.sinal_txt)), 0);
  $('fin-pago').textContent = formatarReais(pago);
  $('fin-pendente').textContent = formatarReais(pendente);
  $('fin-saldo').textContent = formatarReais(saldo);

  const aguard = dados.filter((a) => a.status === STATUS_AGUARDA).length;
  const ok = dados.filter((a) => a.status === STATUS_OK).length;
  const novos = dados.filter(ehNovo).length;
  $('resumo').innerHTML = '';
  [
    ['Total', dados.filter((a) => a.status !== STATUS_CANC).length],
    ['Aguardando sinal', aguard],
    ['Sinal confirmado', ok],
  ].forEach(([t, n]) => {
    const p = document.createElement('span'); p.className = 'pill';
    p.innerHTML = t + ': <b>' + n + '</b>';
    $('resumo').appendChild(p);
  });
  if (novos) {
    const p = document.createElement('span'); p.className = 'pill novo';
    p.innerHTML = '<b>' + novos + '</b> novo(s) nas últimas 24h';
    $('resumo').appendChild(p);
  }

  const lista = $('lista');
  lista.innerHTML = '';
  if (!dados.length) {
    lista.innerHTML = '<p class="vazio">Nenhum agendamento neste período.</p>';
    return;
  }
  let diaAtual = '';
  dados.forEach((a) => {
    if (a.data !== diaAtual) {
      diaAtual = a.data;
      const h = document.createElement('div'); h.className = 'dia';
      h.textContent = new Date(a.data + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
      lista.appendChild(h);
    }
    lista.appendChild(linha(a));
  });
}

function linha(a) {
  const el = document.createElement('div');
  el.className = 'item' + (ehNovo(a) ? ' novo' : '');

  const hora = document.createElement('div'); hora.className = 'hora'; hora.textContent = a.inicio;

  const info = document.createElement('div');
  const nome = document.createElement('div'); nome.className = 'nome'; nome.textContent = a.nome;
  const meta = document.createElement('div'); meta.className = 'meta';
  const numero = a.whatsapp.replace(/\D/g, '');
  const zap = document.createElement('a'); zap.className = 'zap'; zap.target = '_blank'; zap.rel = 'noopener';
  zap.href = 'https://wa.me/' + numero; zap.textContent = 'WhatsApp ' + numero;
  meta.appendChild(zap);
  const tag = document.createElement('span');
  tag.className = 'tag ' + (a.status === STATUS_OK ? 'ok' : a.status === STATUS_CANC ? 'canc' : 'aguard');
  tag.textContent = a.status;
  meta.appendChild(tag);
  if (ehNovo(a)) { const n = document.createElement('span'); n.className = 'tag novo'; n.textContent = 'novo'; meta.appendChild(n); }
  if (a.status !== STATUS_CANC) {
    const resta = document.createElement('span'); resta.className = 'tag resta';
    resta.textContent = 'resta ' + formatarReais(lerReais(a.valor_txt) - lerReais(a.sinal_txt));
    meta.appendChild(resta);
  }
  const pacote = document.createElement('div'); pacote.className = 'meta';
  pacote.textContent = 'Pacote ' + a.pacote + ' · ' + a.valor_txt + ' · sinal ' + a.sinal_txt + ' · cenário ' + (a.cenario || '—') + ' · ' + (a.pessoas || '?') + ' pessoa(s)' + (a.email ? ' · ' + a.email : '');
  info.appendChild(nome); info.appendChild(pacote); info.appendChild(meta);

  const acoes = document.createElement('div'); acoes.className = 'acoes';
  if (a.status !== STATUS_OK && a.status !== STATUS_CANC) {
    const ok = document.createElement('button'); ok.className = 'btn'; ok.type = 'button'; ok.textContent = 'Sinal recebido';
    ok.addEventListener('click', () => mudar(a, STATUS_OK, ok));
    acoes.appendChild(ok);
  }
  if (a.status !== STATUS_CANC) {
    const c = document.createElement('button'); c.className = 'btn perigo'; c.type = 'button'; c.textContent = 'Cancelar';
    c.addEventListener('click', () => { if (confirm('Cancelar o agendamento de ' + a.nome + '?')) mudar(a, STATUS_CANC, c); });
    acoes.appendChild(c);
  }

  el.appendChild(hora); el.appendChild(info); el.appendChild(acoes);
  return el;
}

async function mudar(a, novo, botao) {
  botao.disabled = true;
  try {
    const r = await chamar({ acao: 'status', senha: senha, id: a.id, novo_status: novo });
    if (!r.ok) { $('erro-painel').textContent = r.erro; botao.disabled = false; return; }
    await carregar();
  } catch (e) {
    $('erro-painel').textContent = 'Não consegui salvar. Tente de novo.';
    botao.disabled = false;
  }
}

function entrarPainel() {
  $('tela-login').hidden = true;
  $('tela-painel').hidden = false;
  carregar();
  clearInterval(timer);
  timer = setInterval(carregar, 60000); // atualiza sozinho a cada minuto
}

function sair() {
  senha = '';
  try { sessionStorage.removeItem(CHAVE_SESSAO); } catch (e) {}
  clearInterval(timer);
  $('tela-painel').hidden = true;
  $('tela-login').hidden = false;
}

$('entrar').addEventListener('click', async () => {
  senha = $('senha').value;
  $('erro-login').textContent = '';
  if (!senha) { $('erro-login').textContent = 'Digite a senha.'; return; }
  const r = await chamar({ acao: 'listar', senha: senha, de: '1900-01-01', ate: '1900-01-02' }).catch(() => ({ ok: false, erro: 'Sem conexão.' }));
  if (!r.ok) { senha = ''; $('erro-login').textContent = r.erro === 'Sem conexão.' ? r.erro : 'Senha incorreta.'; return; }
  guardarSenha(senha);
  entrarPainel();
});
$('senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('entrar').click(); });
$('sair').addEventListener('click', sair);
$('atualizar').addEventListener('click', carregar);
$('periodo').addEventListener('change', () => {
  $('faixa-custom').classList.toggle('on', $('periodo').value === 'custom');
  carregar();
});
$('de').addEventListener('change', carregar);
$('ate').addEventListener('change', carregar);

/* já logada nesta aba? entra direto */
if (lerSenha()) { senha = lerSenha(); entrarPainel(); }
</script>
</body>
</html>
